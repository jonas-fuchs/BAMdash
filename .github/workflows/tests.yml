name: Tests

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Matrix test across every supported Python version (per requires-python
    # >=3.9,<3.14). Dependencies are installed at their latest compatible
    # release, so this job also acts as the *maximal* dependency check: it
    # surfaces breaking changes in new releases of kaleido, pandas, plotly,
    # pysam and biopython.
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run test suite
        run: pytest

  min-deps:
    # Installs every runtime dependency pinned to its declared lower bound
    # (e.g. pandas==1.4.4) and runs the full test suite. Guards against the
    # floor being too low: if a test fails or a dep fails to build, the
    # declared minimum is no longer actually supported and the floor must be
    # raised. Runs on the lowest supported Python (3.9), where the oldest
    # dependency versions are most likely to install.
    name: Minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Build minimum-dependency constraints file
        shell: python
        run: |
          import re, tomllib
          from pathlib import Path
          pyproject = tomllib.loads(Path('pyproject.toml').read_text())
          deps = pyproject['project']['dependencies']
          # Each entry looks like "pandas>=1.4.4".
          # Pin to the declared lower bound: "pandas>=1.4.4" -> "pandas==1.4.4".
          pins = []
          for dep in deps:
              m = re.match(r"^\s*([A-Za-z0-9_.-]+)\s*>=\s*([0-9][0-9A-Za-z.\-]*)", dep)
              if not m:
                  raise SystemExit(f"could not parse lower bound: {dep!r}")
              pins.append(f"{m.group(1)}=={m.group(2)}")
          Path('min-constraints.txt').write_text("\n".join(pins) + "\n")
          print("\n".join(pins))

      - name: Install minimum runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c min-constraints.txt -e ".[test]"

      - name: Run test suite against minimum dependencies
        run: pytest
